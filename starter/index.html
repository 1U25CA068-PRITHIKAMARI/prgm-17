<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced HTML Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .table-container {
            max-width: 800px;
            margin: auto;
            overflow-x: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
            text-transform: uppercase;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #d9ecff;
            transition: 0.3s;
        }

        caption {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #444;
        }
    </style>
</head>

<body>
    <h2>Student Details</h2>

    <div class="table-container">
        <table>
            <caption>Student Information Table</caption>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Marks</th>
            </tr>

            <tr>
                <td>101</td>
                <td>Arun</td>
                <td>Computer Science</td>
                <td>85</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Priya</td>
                <td>Information Technology</td>
                <td>92</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Ravi</td>
                <td>Electronics</td>
                <td>78</td>
            </tr>

            <tr>
                <td>104</td>
                <td>Divya</td>
                <td>Computer Science</td>
                <td>88</td>
            </tr>
        </table>
    </div>
</body>
</html>
